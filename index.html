<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Lâm Châu Minh Khuê - Bất Động Sản</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --text-color: #333333;
            --bg-color: #f7fafc;
            --border-color: #e2e8f0;
            --highlight-color: #e53e3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e2e8f0;
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .cv-container {
            max-width: 850px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Header Section */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header h2 {
            font-size: 1.25rem;
            color: #ebf8ff;
            font-weight: 400;
            margin-bottom: 1.5rem;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            font-size: 0.95rem;
        }

        .contact-info span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Main Content */
        .main-content {
            padding: 2.5rem;
        }

        .section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            color: var(--primary-color);
            font-size: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Experience & Education */
        .timeline-item {
            margin-bottom: 1.5rem;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.5rem;
        }

        .timeline-header h3 {
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .timeline-header .date {
            color: #718096;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .company {
            color: var(--secondary-color);
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .timeline-item ul {
            list-style-type: none;
            margin-left: 0;
        }

        .timeline-item li {
            margin-bottom: 0.5rem;
            position: relative;
            padding-left: 1.5rem;
        }

        .timeline-item li::before {
            content: "•";
            color: var(--secondary-color);
            font-weight: bold;
            position: absolute;
            left: 0;
            top: 0;
        }

        .timeline-item li strong {
            color: var(--primary-color);
        }

        .skills-grid
